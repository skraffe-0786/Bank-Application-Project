<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForgotPassword-My Bank</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'ForgotPassword.css'  %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <form action=""   method="post">
        {% csrf_token %}

        <div class="page">
            <img src="{% static 'bank.png.jpeg'  %}" id="image">
            <div class="form">
                <div class="forgot">
                    <div class="bank_name">
                        <i class="bi bi-bank"></i>
                        My Bank
                    </div>
                    <div class="head">
                        <h2> Forgot Password?</h2>
                        <p>Enter your registered email</p>
                    </div>
                    <p>Email :</p>
                    <div class="input_box">
                        <i class="bi bi-envelope"></i>
                        <input type="email" id="mail"  name="email" placeholder="Entered registered email"  required >
                    </div>
                    {% if error  %}
                        <p id="error">{{ error  }}</p>
                    {% endif %}
                    <button type="submit" id="btn">
                        <i class="bi bi-key-fill"></i>
                        SEND OTP
                    </button>
                    <a href="{% url 'login-page'  %}" id="back">
                        <i class="bi bi-arrow-left"></i>
                        Back to Login
                    </a>
                    
                </div>
            </div>
        </div>
    </form>
    
</body>
</html>
