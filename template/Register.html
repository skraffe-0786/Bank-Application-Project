<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTER-PAGE</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'Register.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <form action="" method="post">
        <div class="register">
            <img src="{% static 'register.png.png' %}" id="image">
            <div class="form">
                {% csrf_token %}
                <div class="page">
                    <p id="heading">REGISTRATION FORM :</p>
                    <p>First Name :</p>
                    <input type="text" required placeholder="enter First name" id="first" name="firstname">
                    <p>Last Name :</p>
                    <input type="text" required placeholder="enter Last name" id="first" name="lastname">
                    <p>Email :</p>
                    <input type="email" required placeholder="enter email" id="first" name="email">
                    <p>Password :</p>
                    <input type="password" required placeholder="enter password" id="first" name="password">
                    <p>Confirm Password :</p>
                    <input type="password" required placeholder="enter confirm Password" id="first"
                        name="confirm_password">
                    <div class="error">
                        {{error}}
                    </div>
                    <button type="submit" id="btn">REGISTER NOW</button>
                </div>
            </div>
        </div>
    </form>
    </div>


</body>

</html>
