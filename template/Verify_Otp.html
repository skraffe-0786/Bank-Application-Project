<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify_Otp--MyBank</title>
    {% load static  %}
    <link rel="stylesheet" href="{% static 'verify_otp.css'  %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <form action="" method="post">
        <div class="page">
            <img src="{% static 'bank.png.jpeg'  %}" id="image">
            <div class="form">
                <div class="verify">
                    <div class="bank_name">
                        <i class="bi bi-bank"></i>
                        My Bank
                    </div>
                    <div class="head">
                        <h2>Verify OTP</h2>
                        <p>Enter Your 6-digit OTP sent to Your email</p>
                    </div>
                    <p >OTP :</p>
                    <div class="input_box">
                        <i class="bi bi-shield-lock"></i>
                        <input type="text" name="otp" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" inputmode="numeric" required>
                    </div>
                    {% if error  %}
                        <p id="error">{{ error  }}</p>
                    {% endif %}
                    <button type="submit" id="btn">
                        <i class="bi bi-check-circle"></i>
                        VERIFY OTP
                    </button>
                    <a href="{% url 'forgot'  %}" id="back">
                        <i class="bi bi-arrow-left"></i>
                        BACK
                    </a>
                </div>
            </div>
        </div>
    </form>
    
</body>
</html>
